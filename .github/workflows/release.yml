name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build app
        run: pnpm build

      - name: Package (${{ matrix.platform }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Disable auto identity discovery unless a cert secret is present
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
        run: |
          EXTRA=()
          if [[ "${{ matrix.platform }}" == "mac" && -n "${APPLE_ID}" && -n "${APPLE_TEAM_ID}" && -n "${APPLE_APP_SPECIFIC_PASSWORD}" ]]; then
            EXTRA+=(-c.mac.notarize=true)
            echo "Notarization enabled"
          else
            echo "Notarization skipped (secrets missing or non-mac)"
          fi
          pnpm exec electron-builder --${{ matrix.platform }} --publish never "${EXTRA[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: codex-studio-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    # Only publish when every platform build succeeded (no empty releases).
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: codex-studio-*

      - name: Verify artifacts
        run: |
          count=$(find artifacts -type f | wc -l)
          echo "Found $count artifact file(s)"
          find artifacts -type f
          if [ "$count" -eq 0 ]; then
            echo "No release artifacts downloaded — aborting"
            exit 1
          fi
          # electron-updater needs latest-*.yml on the Release
          if ! find artifacts -name 'latest*.yml' | grep -q .; then
            echo "WARNING: no latest*.yml found — in-app auto-update may not work until yml is published"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
